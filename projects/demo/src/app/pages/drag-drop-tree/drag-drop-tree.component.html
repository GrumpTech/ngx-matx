<matx-drag-drop-tree [nodes]="nodes" (dropped)="handleDropped($event)" />
<br />

<matx-drag-drop-tree
  [nodes]="nodes2"
  (dropped)="handleDropped2($event)"
  class="tree"
>
  <ng-template #headerTemplate let-item="item">
    <div (click)="handleClick(item.title)" class="tree-node">
      @if (item.childNodes) {
        {{ item.data }}
      } @else {
        <em>{{ item.data }}</em>
      }
    </div>
  </ng-template>
</matx-drag-drop-tree>
