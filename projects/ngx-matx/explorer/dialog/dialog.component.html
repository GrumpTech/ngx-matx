<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content (keydown.enter)="commit($event)">
  <matx-full-width-form-fields>
    <mat-form-field floatLabel="always">
      <mat-label>Filename</mat-label>
      <input matInput [formControl]="formControl" />
      <mat-error>File with this name already exists.</mat-error>
      <mat-hint>Use slashes to create folders: "folder/file".</mat-hint>
    </mat-form-field>
  </matx-full-width-form-fields>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="cancel()">Cancel</button>
  <button
    mat-button
    [disabled]="buttonDisabled | async"
    (click)="click()"
    color="primary"
  >
    {{ data.buttonText }}
  </button>
</div>
