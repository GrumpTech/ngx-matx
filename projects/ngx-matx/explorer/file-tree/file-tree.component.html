<mat-tree
  #tree
  [dataSource]="data()"
  [childrenAccessor]="childrenAccessor"
  [expansionKey]="expansionKeyFn"
>
  <mat-tree-node
    *matTreeNodeDef="let node"
    matTreeNodePadding
    matTreeNodePaddingIndent="10"
    (click)="handleClick(node.fullName)"
    (activation)="handleClick(node.fullName)"
    [class.active]="node.fullName === selectedFile()"
  >
    <mat-icon />
    {{ node.name }}
  </mat-tree-node>
  <mat-tree-node
    *matTreeNodeDef="let node; when: hasChild"
    matTreeNodePadding
    matTreeNodePaddingIndent="10"
    matTreeNodeToggle
  >
    <mat-icon class="tree-button">
      <mat-icon>
        {{ tree.isExpanded(node) ? "expand_more" : "chevron_right" }}
      </mat-icon>
    </mat-icon>
    {{ node.name }}
  </mat-tree-node>
</mat-tree>
