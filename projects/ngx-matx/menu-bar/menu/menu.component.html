<mat-menu [hasBackdrop]="false" [class]="class()">
  @for (item of items(); track item) {
    @if (!item.children?.length) {
      <button mat-menu-item (click)="handleClick(item)">
        @if (item.icon !== undefined) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        <span
          >{{ item.text }}
          @if (item.shortcuts) {
            <span class="shortcut">{{ getShortcutText(item.shortcuts) }}</span>
          }
        </span>
      </button>
    } @else {
      <button mat-menu-item [matMenuTriggerFor]="matxMenu.menu()">
        @if (item.icon !== undefined) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        <span
          >{{ item.text }}
          @if (item.shortcuts) {
            <span class="shortcut">{{ getShortcutText(item.shortcuts) }}</span>
          }
        </span>
      </button>
      <matx-menu
        #matxMenu
        [items]="item.children!"
        (itemClick)="handleClick($event)"
        [class]="class()"
      />
    }
  }
</mat-menu>
